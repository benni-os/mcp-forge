[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-forge"
version = "0.1.1"
description = "The FastAPI-style framework for building MCP servers in Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Benni Alencar", email = "benni@mcp-forge.dev" }]
keywords = ["mcp", "model-context-protocol", "llm", "ai", "agents", "tools", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13.4"]

[project.optional-dependencies]
http = ["fastapi>=0.141.1", "uvicorn[standard]>=0.52.1"]
sse  = ["fastapi>=0.141.1", "uvicorn[standard]>=0.52.1"]
cli  = ["typer>=0.27.0"]
web  = ["httpx>=0.28.1"]
dev  = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "anyio[trio]>=4.14.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "typer>=0.27.0",
    "httpx>=0.28.1",
    "ruff>=0.16.1",
    "mypy>=2.3.1",
    "nest-asyncio>=1.6",
]
all = ["mcp-forge[http,sse,cli,web]"]

[project.urls]
Homepage      = "https://github.com/benni-os/mcp-forge"
Repository    = "https://github.com/benni-os/mcp-forge"
Issues        = "https://github.com/benni-os/mcp-forge/issues"
Documentation = "https://github.com/benni-os/mcp-forge#readme"
Changelog     = "https://github.com/benni-os/mcp-forge/blob/main/CHANGELOG.md"

[project.scripts]
mcp-forge = "mcp_forge.cli.main:app"

[tool.hatch.version]
path = "mcp_forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mcp_forge"]
include   = ["mcp_forge/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"mcp_forge/__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version         = "3.11"
strict                 = true
warn_return_any        = true
warn_unused_configs    = true
show_error_codes       = true
